name: CI/CD Pipeline - Build, Test & Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    name: Build, Lint & Automated Docs Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Production Build
        run: npm run build

      - name: Generate Technical Documentation (Compodoc)
        run: npm run docs:build

      - name: Archive Production Artifacts (PWA)
        uses: actions/upload-artifact@v4
        with:
          name: pwa-production-build
          path: www/
          retention-days: 14

      - name: Archive Compodoc Documentation
        uses: actions/upload-artifact@v4
        with:
          name: compodoc-documentation
          path: docs/
          retention-days: 14
